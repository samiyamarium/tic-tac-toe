<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sparkle Tic Tac Toe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #FF6FB5;
    --pink-dark: #D6317A;
    --pink-light: #FFE3F0;
    --white: #FFFFFF;
    --mint: #7CE0C6;
    --mint-dark: #21A883;
    --shadow: rgba(214, 49, 122, 0.25);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 20% 20%, #FFD3EA 0%, var(--pink-light) 45%, #FFC9E3 100%);
    font-family: 'Quicksand', sans-serif;
    color: var(--pink-dark);
    padding: 24px;
    overflow-x: hidden;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 440px;
  }

  .sparkle {
    position: absolute;
    font-size: 28px;
    animation: float 4s ease-in-out infinite;
    pointer-events: none;
    user-select: none;
  }
  .sparkle.one { top: -10px; left: -18px; animation-delay: 0s; }
  .sparkle.two { top: 10px; right: -20px; animation-delay: 1.2s; font-size: 22px; }
  .sparkle.three { bottom: 40px; left: -30px; animation-delay: 2.1s; font-size: 20px; }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(12deg); }
  }

  .card {
    background: var(--white);
    border-radius: 32px;
    padding: 32px 28px 28px;
    box-shadow: 0 20px 45px var(--shadow), 0 2px 0 rgba(255,255,255,0.6) inset;
    text-align: center;
  }

  h1 {
    font-family: 'Baloo 2', cursive;
    font-size: clamp(28px, 6vw, 36px);
    margin: 0 0 4px;
    color: var(--pink-dark);
    letter-spacing: 0.5px;
  }

  .subtitle {
    margin: 0 0 20px;
    font-weight: 600;
    color: var(--pink);
    font-size: 15px;
  }

  .scoreboard {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 20px;
  }

  .score-pill {
    flex: 1;
    background: var(--pink-light);
    border-radius: 18px;
    padding: 10px 6px;
    font-family: 'Baloo 2', cursive;
    transition: transform 0.15s ease;
  }

  .score-pill .label {
    display: block;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 12px;
    color: var(--pink-dark);
    margin-bottom: 2px;
  }

  .score-pill .value {
    font-size: 22px;
    color: var(--pink-dark);
  }

  .score-pill.mint { background: #E4FBF4; }
  .score-pill.mint .value { color: var(--mint-dark); }

  .status {
    font-family: 'Baloo 2', cursive;
    font-size: 20px;
    min-height: 30px;
    margin-bottom: 18px;
    color: var(--pink-dark);
    transition: transform 0.2s ease;
  }

  .status.win {
    animation: bounce 0.6s ease;
  }

  @keyframes bounce {
    0% { transform: scale(0.7); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 0 auto 24px;
    max-width: 320px;
  }

  .cell {
    aspect-ratio: 1 / 1;
    background: var(--pink-light);
    border: none;
    border-radius: 20px;
    font-family: 'Baloo 2', cursive;
    font-size: clamp(36px, 9vw, 48px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.2s ease, box-shadow 0.2s ease;
    color: var(--pink-dark);
    box-shadow: 0 4px 0 rgba(214, 49, 122, 0.12);
  }

  .cell:hover:not(:disabled) {
    background: #FFD3EA;
    transform: translateY(-2px);
  }

  .cell:active:not(:disabled) {
    transform: translateY(1px);
    box-shadow: 0 1px 0 rgba(214, 49, 122, 0.12);
  }

  .cell:disabled {
    cursor: default;
  }

  .cell.o-mark {
    color: var(--mint-dark);
  }

  .cell.pop {
    animation: pop 0.25s ease;
  }

  @keyframes pop {
    0% { transform: scale(0.4); opacity: 0.4; }
    70% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  .cell.win-glow {
    background: #FFC1E0;
    box-shadow: 0 0 0 3px var(--pink), 0 4px 0 rgba(214, 49, 122, 0.12);
    animation: glow 0.9s ease-in-out infinite;
  }

  .cell.win-glow.o-mark {
    background: #CDF6EA;
    box-shadow: 0 0 0 3px var(--mint-dark), 0 4px 0 rgba(214, 49, 122, 0.12);
  }

  @keyframes glow {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.08); }
  }

  button.action {
    font-family: 'Baloo 2', cursive;
    font-size: 16px;
    border: none;
    border-radius: 999px;
    padding: 12px 26px;
    background: linear-gradient(135deg, var(--pink) 0%, var(--pink-dark) 100%);
    color: white;
    cursor: pointer;
    box-shadow: 0 8px 18px var(--shadow);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  button.action:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px var(--shadow);
  }

  button.action:active {
    transform: translateY(1px);
  }

  button.reset-scores {
    background: none;
    border: none;
    color: var(--pink);
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 13px;
    margin-top: 14px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .confetti {
    position: fixed;
    top: -20px;
    font-size: 20px;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 10;
  }

  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); opacity: 0.2; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sparkle, .cell.pop, .status.win, .cell.win-glow, .confetti {
      animation: none !important;
    }
  }
</style>
</head>
<body>

<div class="stage">
  <span class="sparkle one">✨</span>
  <span class="sparkle two">💖</span>
  <span class="sparkle three">⭐</span>

  <div class="card">
    <h1>Sparkle Tic Tac Toe</h1>
    <p class="subtitle">Pink vs. Mint — who's got next?</p>

    <div class="scoreboard">
      <div class="score-pill">
        <span class="label">X wins</span>
        <span class="value" id="scoreX">0</span>
      </div>
      <div class="score-pill">
        <span class="label">Draws</span>
        <span class="value" id="scoreDraw">0</span>
      </div>
      <div class="score-pill mint">
        <span class="label">O wins</span>
        <span class="value" id="scoreO">0</span>
      </div>
    </div>

    <p class="status" id="status">X's turn!</p>

    <div class="board" id="board"></div>

    <button class="action" id="playAgain">Play again</button>
    <br>
    <button class="reset-scores" id="resetScores">Reset scores</button>
  </div>
</div>

<script>
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const playAgainBtn = document.getElementById('playAgain');
  const resetScoresBtn = document.getElementById('resetScores');
  const scoreXEl = document.getElementById('scoreX');
  const scoreOEl = document.getElementById('scoreO');
  const scoreDrawEl = document.getElementById('scoreDraw');

  const WIN_LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  let cells = Array(9).fill(null);
  let currentPlayer = 'X';
  let gameOver = false;
  let scores = { X: 0, O: 0, draw: 0 };

  function renderBoard() {
    boardEl.innerHTML = '';
    cells.forEach((value, i) => {
      const btn = document.createElement('button');
      btn.className = 'cell' + (value === 'O' ? ' o-mark' : '');
      btn.textContent = value || '';
      btn.disabled = !!value || gameOver;
      btn.addEventListener('click', () => handleMove(i));
      boardEl.appendChild(btn);
    });
  }

  function handleMove(index) {
    if (cells[index] || gameOver) return;
    cells[index] = currentPlayer;
    renderBoard();
    const cellEl = boardEl.children[index];
    cellEl.classList.add('pop');

    const winLine = checkWin(currentPlayer);
    if (winLine) {
      gameOver = true;
      scores[currentPlayer]++;
      updateScoreboard();
      highlightWin(winLine);
      statusEl.textContent = currentPlayer + ' wins! 🎉';
      statusEl.classList.add('win');
      launchConfetti();
      disableAllCells();
      return;
    }

    if (cells.every(c => c)) {
      gameOver = true;
      scores.draw++;
      updateScoreboard();
      statusEl.textContent = "It's a sweet draw!";
      statusEl.classList.add('win');
      return;
    }

    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
    statusEl.textContent = currentPlayer + "'s turn!";
  }

  function checkWin(player) {
    return WIN_LINES.find(line => line.every(i => cells[i] === player)) || null;
  }

  function highlightWin(line) {
    line.forEach(i => {
      boardEl.children[i].classList.add('win-glow');
    });
  }

  function disableAllCells() {
    Array.from(boardEl.children).forEach(c => c.disabled = true);
  }

  function updateScoreboard() {
    scoreXEl.textContent = scores.X;
    scoreOEl.textContent = scores.O;
    scoreDrawEl.textContent = scores.draw;
  }

  function launchConfetti() {
    const emojis = ['✨','💖','⭐','🎀','💗'];
    for (let i = 0; i < 18; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti';
      piece.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.animationDuration = (2 + Math.random() * 1.5) + 's';
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 3600);
    }
  }

  function newRound() {
    cells = Array(9).fill(null);
    currentPlayer = 'X';
    gameOver = false;
    statusEl.classList.remove('win');
    statusEl.textContent = "X's turn!";
    renderBoard();
  }

  playAgainBtn.addEventListener('click', newRound);
  resetScoresBtn.addEventListener('click', () => {
    scores = { X: 0, O: 0, draw: 0 };
    updateScoreboard();
  });

  renderBoard();
</script>

</body>
</html>
